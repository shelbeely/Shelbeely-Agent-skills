name: Export SVG from Figma

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter pattern (regex) to match component names (optional)'
        required: false
        default: ''
      batch_size:
        description: 'Number of components per batch'
        required: false
        default: '50'

permissions:
  contents: write

jobs:
  figma-export:
    name: Figma Export
    runs-on: ubuntu-latest
    environment: copilot
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Export SVGs from Figma
        env:
          FIGMA_FILE_URL: "https://www.figma.com/file/lC2BGHfMdhAmcEFhx9S6df/Material-3-Design-Kit--Community-"
          FIGMA_TOKEN: ${{ secrets.COPILOT_MCP_FIGMA_API_KEY }}
          OUTPUT_DIR: ./figma-export
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '50' }}
          FILTER_PATTERN: ${{ github.event.inputs.filter }}
        run: |
          node .github/scripts/export-figma-svgs.mjs

      - name: Commit exported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figma-export/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Figma export assets"
            git push
          fi
