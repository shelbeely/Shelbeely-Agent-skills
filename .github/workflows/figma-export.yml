name: Export SVG from Figma

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figma-export:
    name: Figma Export
    runs-on: ubuntu-latest
    environment: copilot
    steps:
      - uses: actions/checkout@v4

      - uses: primer/figma-action@v1.0.0-alpha.3
        with:
          args: "format=svg outputDir=./figma-export/"
        env:
          FIGMA_FILE_URL: "https://www.figma.com/file/lC2BGHfMdhAmcEFhx9S6df/Material-3-Design-Kit--Community-"
          FIGMA_TOKEN: ${{ secrets.COPILOT_MCP_FIGMA_API_KEY }}

      - name: Commit exported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figma-export/
          git diff --cached --quiet || git commit -m "Update Figma export assets"
          git push
